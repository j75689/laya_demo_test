[package]
name = "snake-laya"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
block2 = "0.6.2"
clap = { version = "4.6.7", features = ["derive"] }
ndarray = "0.17.2"
objc2 = "0.6.4"
objc2-core-ml = "0.3.2"
objc2-foundation = "0.3.2"
ort = { version = "2.0.0-rc.13", features = ["coreml"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
tokenizers = { version = "0.23.2", default-features = false, features = ["onig"] }

[profile.release]
lto = "thin"
codegen-units = 1
